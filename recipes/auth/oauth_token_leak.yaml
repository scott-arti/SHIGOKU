name: oauth_token_leak
description: "Golden Recipe: Detect leaked OAuth Tokens in referer/logs/history"
agent: swarm
trigger:
  type: signal
  required_signals:
    - auth_endpoint
    - oauth
    - bearer_token
  success_condition: "token_found_in_unexpected_location"
  stop_condition: "no_oauth_surface_or_probe_blocked_or_evidence_insufficient"
tags:
  - auth
  - oauth
  - token-leak
severity: high
steps:
  - id: step_0
    name: "Check for token leaks"
    action: "recon"
    params:
      probe_type: "token_leak"
      techniques:
        - referer_header
        - access_logs
        - browser_history
        - transparent_get_params
    dependencies: []
  - id: step_1
    name: "Confirm token leak"
    action: "analyze"
    params:
      check: "token_leak_validation"
    dependencies:
      - step_0
  - id: step_2
    name: "Collect leak evidence"
    action: "report"
    params:
      evidence_type: "oauth_token_leak"
    dependencies:
      - step_0
      - step_1
