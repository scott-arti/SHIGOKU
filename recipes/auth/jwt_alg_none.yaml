name: jwt_alg_none
description: "Golden Recipe: JWT Algorithm None / Key Confusion Attack"
agent: swarm
trigger:
  type: signal
  required_signals:
    - auth_endpoint
    - bearer_token
    - jwt
  success_condition: "alg_none_accepted_or_key_confusion_accepted"
  stop_condition: "no_jwt_token_or_probe_blocked_or_evidence_insufficient"
tags:
  - auth
  - jwt
  - algorithm
severity: critical
steps:
  - id: step_0
    name: "Probe algorithm weaknesses"
    action: "auth_attack"
    params:
      probe_type: "jwt_algorithm"
      techniques:
        - alg_none
        - key_confusion_rs256_hs256
    dependencies: []
  - id: step_1
    name: "Check algorithm acceptance"
    action: "analyze"
    params:
      check: "jwt_algorithm_validation"
    dependencies:
      - step_0
  - id: step_2
    name: "Collect algorithm attack evidence"
    action: "report"
    params:
      evidence_type: "jwt_alg_none"
    dependencies:
      - step_0
      - step_1
