name: refresh_rotation
description: "Golden Recipe: Detect refresh token rotation failures, old token reuse, scope drift"
agent: swarm
trigger:
  type: signal
  required_signals:
    - auth_endpoint
    - refresh
    - bearer_token
  success_condition: "old_token_reuse_accepted_or_scope_drift_detected_or_revocation_gap"
  stop_condition: "no_refresh_endpoint_or_probe_blocked_or_evidence_insufficient"
tags:
  - auth
  - refresh
  - rotation
severity: high
steps:
  - id: step_0
    name: "Probe refresh token rotation"
    action: "auth_attack"
    params:
      probe_type: "refresh_rotation"
      techniques:
        - old_token_reuse
        - scope_drift
        - revocation_gap
    dependencies: []
  - id: step_1
    name: "Confirm rotation failures"
    action: "analyze"
    params:
      check: "refresh_rotation_validation"
    dependencies:
      - step_0
  - id: step_2
    name: "Collect rotation evidence"
    action: "report"
    params:
      evidence_type: "refresh_rotation"
    dependencies:
      - step_0
      - step_1
