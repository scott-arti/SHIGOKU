name: oauth_binding_drift
description: "Golden Recipe: Detect OAuth state/nonce/redirect_uri binding failures"
agent: swarm
trigger:
  type: signal
  required_signals:
    - auth_endpoint
    - bearer_token
  optional_signals:
    - oauth
    - oauth_callback
  success_condition: "binding_invariant_broken_or_unexpected_redirect_accepted"
  stop_condition: "no_oauth_surface_or_probe_blocked_or_evidence_insufficient"
tags:
  - auth
  - oauth
  - binding
severity: high
steps:
  - id: step_0
    name: "Probe OAuth binding invariants"
    action: "auth_attack"
    params:
      probe_type: "binding_drift"
      techniques:
        - state_replay
        - nonce_reuse
        - redirect_uri_open
    dependencies: []
  - id: step_1
    name: "Confirm binding failures"
    action: "analyze"
    params:
      check: "binding_invariant_validation"
    dependencies:
      - step_0
  - id: step_2
    name: "Collect binding evidence"
    action: "report"
    params:
      evidence_type: "oauth_binding_drift"
    dependencies:
      - step_0
      - step_1
