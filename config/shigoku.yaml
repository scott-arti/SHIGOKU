# SHIGOKU 統合設定ファイル
# 環境変数は ${VAR_NAME} 形式で展開されます

# モード設定
mode: bugbounty # bugbounty | vulntest | ctf
ctf_flag_format: "flag{.*}"

# ---- Task Queue Pruning (SGK-2026-0287) ----
# shadow: record candidates only, no actual deletion.
# active: apply actual deletions for approved task types (requires gate).
# Any unrecognised value is treated as shadow (fail-closed).
pruning_mode: shadow

# Instant killswitch. When true, pruning behaves as shadow regardless of
# pruning_mode. Candidate traces are recorded, deletion count is always 0.
pruning_killswitch_enabled: false

# プロジェクト設定
project_name: "Shigoku"
project_path: "/home/bbb/Documents/App/Shigoku"

# 通知設定
notification:
  slack_webhook: ${SLACK_WEBHOOK}
  discord_webhook: ${DISCORD_WEBHOOK}
  notify_on_critical: true
  notify_on_high: true

# ツール設定
tools:
  nuclei: true
  nuclei_path: nuclei
  gau: true
  katana: true

# スキャン設定
scan:
  rate_limit: 50
  timeout: 30
  threads: 10
  max_concurrent_tasks: 4
  max_depth: 3
  follow_redirects: true
  user_agent: "SHIGOKU/1.0"
  # Proxy Configuration (Caido/Burp) - leave empty to run without mandatory proxy
  proxy: ""

# 並列実行設定。enabled を false にすると常に直列実行へ戻ります。
parallelism:
  enabled: true
  kill_switch: false
  shadow_mode: true
  default_executor: serial

# VDP (SGK-2026-0420): off | record_only | shadow (default: off)
vdp:
  mode: "off"
  # label_leakage_denylist: []   # 製品名等を拒否リストへ追加する場合

# LLM の設定場所です。モデルを変える時は、下の providers → profiles → roles の順で確認します。
# API キーそのものはここに書かず、api_key_env で指定した OS 環境変数にだけ設定します。
llm:
  # 設定形式の版。通常は変更しません。
  schema_version: 1
  # role を指定しない呼出しで使う役割です。
  default_role: specialist_light

  # 接続先ごとの設定です。新しい会社・APIを追加する時は、名前、APIキーの環境変数名、明示的なURLを追加します。
  # URL を省略してモデル名から自動判定することはしません。
  providers:
    deepseek:
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com/v1
    openai:
      api_key_env: OPENAI_API_KEY
      base_url: https://api.openai.com/v1
    deepinfra:
      api_key_env: DEEPINFRA_API_KEY
      base_url: https://api.deepinfra.com/v1
    wandb:
      api_key_env: WANDB_API_KEY
      base_url: https://api.inference.wandb.ai/v1
    cerebras:
      api_key_env: Cerebras_API_KEY
      base_url: https://api.cerebras.ai/v1
    any_llm:
      api_key_env: ANY_LLM_API_KEY
      base_url: http://localhost:8000/v1

  # モデルごとの設定です。モデルを追加・変更する時はここに profile を追加します。
  # provider は上の providers の名前、model はその provider が受け付けるモデル名です。
  # thinking.type は enabled / disabled、reasoning_effort は provider にそのまま送る値です。不要なら null にします。
  profiles:
    cheap_api:
      provider: deepseek
      model: deepseek/deepseek-v4-flash
      timeout_seconds: 300
      max_retries: 2
      max_concurrency: 4
      rate_limit_per_minute: 60
      temperature: 0.0
      extra:
        thinking:
          type: disabled
          reasoning_effort: null
    reasoning_api:
      provider: deepseek
      model: deepseek/deepseek-v4-pro
      timeout_seconds: 300
      max_retries: 2
      max_concurrency: 2
      rate_limit_per_minute: 30
      temperature: 0.0
      extra:
        thinking:
          type: enabled
          reasoning_effort: high
    vision_api:
      provider: openai
      model: openai/gpt-4o
      timeout_seconds: 300

  # SHIGOKU の機能ごとに使う profile を決めます。
  # 例: planner を別モデルにしたい場合は、planner.profile を追加した profile 名へ変更します。
  # fallback_profile は最初のモデルが失敗した時だけ使う予備の profile です。
  roles:
    planner:
      profile: reasoning_api
      fallback_profile: cheap_api
      system_prompt_template: conductor/planning.md
    swarm_manager:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: agents/manager_base.md
    tool_output_analysis:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/tool_output_analysis.md
    rag_compression:
      profile: cheap_api
      system_prompt_template: roles/rag_compression.md
    final_judgement:
      profile: reasoning_api
      fallback_profile: cheap_api
      system_prompt_template: roles/final_judgement.md
    specialist_light:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/specialist_light.md
    xss_specialist:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/xss_specialist.md
    xss_rejudge:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/xss_specialist.md
    xss_final:
      profile: reasoning_api
      fallback_profile: cheap_api
      system_prompt_template: roles/xss_specialist.md
    sqli_specialist:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/sqli_specialist.md
    lfi_specialist:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/lfi_specialist.md
    cmd_ssrf_specialist:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/cmd_ssrf_specialist.md
    actor_critic:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/actor_critic.md
    recipe_generator:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/recipe_generator.md
    attack_suggester:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/attack_suggester.md
    response_classifier:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/response_classifier.md
    vuln_validator:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/vuln_validator.md
    chain_proposer:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/chain_proposer.md
    ops_intent:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/ops_intent.md
    vision_analysis:
      profile: vision_api
      fallback_profile: cheap_api
      system_prompt_template: roles/vision_analysis.md
      optional: true

ops_intent:
  feature_flag: true
  kill_switch: false
  llm_parse_timeout_sec: 15
  command_timeout_sec: 900
  retry_budget: 0
  max_attack_targets_per_run: 25
  non_tty_policy: fail_closed
  daily_llm_budget: 25

# 外部API設定
api:
  shodan_api_key: ${SHODAN_API_KEY}

# レポート設定
reporting:
  attack_paths:
    max_mermaid_nodes: 25
    max_mermaid_edges: 40
    max_top_paths: 5
