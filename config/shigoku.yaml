# SHIGOKU 統合設定ファイル
# 環境変数は ${VAR_NAME} 形式で展開されます

# モード設定
mode: bugbounty # bugbounty | vulntest | ctf
ctf_flag_format: "flag{.*}"

# ---- Task Queue Pruning (SGK-2026-0287) ----
# shadow: record candidates only, no actual deletion.
# active: apply actual deletions for approved task types (requires gate).
# Any unrecognised value is treated as shadow (fail-closed).
pruning_mode: shadow

# Instant killswitch. When true, pruning behaves as shadow regardless of
# pruning_mode. Candidate traces are recorded, deletion count is always 0.
pruning_killswitch_enabled: false

# プロジェクト設定
project_name: "Shigoku"
project_path: "/home/bbb/Documents/App/Shigoku"

# 通知設定
notification:
  slack_webhook: ${SLACK_WEBHOOK}
  discord_webhook: ${DISCORD_WEBHOOK}
  notify_on_critical: true
  notify_on_high: true

# ツール設定
tools:
  nuclei: true
  nuclei_path: nuclei
  gau: true
  katana: true

# スキャン設定
scan:
  rate_limit: 50
  timeout: 30
  threads: 10
  max_concurrent_tasks: 4
  max_depth: 3
  follow_redirects: true
  user_agent: "SHIGOKU/1.0"
  # Proxy Configuration (Caido/Burp) - leave empty to run without mandatory proxy
  proxy: ""

# 並列実行設定。enabled を false にすると常に直列実行へ戻ります。
parallelism:
  enabled: true
  kill_switch: false
  shadow_mode: true
  default_executor: serial

# VDP (SGK-2026-0420/0421): off | record_only | shadow | readonly_enforce (default: off)
#   readonly_enforce (M3a): 読取系follow-upのみをfull admission/scope/budget/HITL gateで実行
vdp:
  mode: "off"
  # M3a is fail-closed unless the program explicitly allows the action.
  # capability_rules:
  #   follow_up_probe: "allowed"
  # kill_switch: false   # SGK-2026-0421/0423: true で queue投入前・通信直前の両方でVDP follow-upを停止
  # label_leakage_denylist: []   # 製品名等を拒否リストへ追加する場合
  #
  # SGK-2026-0423: 段階導入 (m0..m4)。"" なら mode から導出。明示stageはmodeを超える昇格には使えない。
  # stage: ""
  # stage_flags: {}      # 各段階の独立無効化（false にするとその段階以上が cap される）
  #   # m3b: false
  #   # m3c: false
  #   # m4: false
  #
  # SGK-2026-0423: confirmed鍵 provider / registry（enforce段階 M3a+ では home フォールバック禁止）
  # key_provider: "env"  # env | file | env_or_file（enforce では env か file の明示のみ）
  # key_env_var: "SHIGOKU_VDP_SIGNING_KEY"
  # key_file_path: ""    # 明示パス（enforce では必須; ~ フォールバックは行わない）
  # key_registry_path: ""   # version付きkey registry JSON（enforce では必須）
  # progression_records_path: ""  # M0-M4 進級実証記録（M3b 以上は必須。設定だけで状態変更を有効化できない）
  # thresholds_path: ""       # hidden holdout 用 frozen threshold artifact

# SGK-2026-0425: VDP診断telemetry（additive。default off で既存出力と bit 単位同一）
#   enabled=false: 診断event収集なし（通常run。既存経路を維持）
#   required=true:  評価run。hook失敗時は次のネットワーク通信前に停止・checkpoint・Hold
#   max_events / max_artifact_bytes / checkpoint_interval_events / event_queue_capacity:
#     イベント・artifact上限（不正値は fail-closed で既定値へ）
diagnostics:
  enabled: false
  required: false
  max_events: 2000
  max_artifact_bytes: 10485760
  checkpoint_interval_events: 500
  event_queue_capacity: 5000

# LLM の設定場所です。モデルを変える時は、下の providers → profiles → roles の順で確認します。
# API キーそのものはここに書かず、api_key_env で指定した OS 環境変数にだけ設定します。
llm:
  # 設定形式の版。通常は変更しません。
  schema_version: 1
  # role を指定しない呼出しで使う役割です。
  default_role: specialist_light

  # 接続先ごとの設定です。新しい会社・APIを追加する時は、名前、APIキーの環境変数名、明示的なURLを追加します。
  # URL を省略してモデル名から自動判定することはしません。
  providers:
    deepseek:
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com/v1
    openai:
      api_key_env: OPENAI_API_KEY
      base_url: https://api.openai.com/v1
    deepinfra:
      api_key_env: DEEPINFRA_API_KEY
      base_url: https://api.deepinfra.com/v1
    wandb:
      api_key_env: WANDB_API_KEY
      base_url: https://api.inference.wandb.ai/v1
    cerebras:
      api_key_env: Cerebras_API_KEY
      base_url: https://api.cerebras.ai/v1
    any_llm:
      api_key_env: ANY_LLM_API_KEY
      base_url: http://localhost:8000/v1

  # モデルごとの設定です。モデルを追加・変更する時はここに profile を追加します。
  # provider は上の providers の名前、model はその provider が受け付けるモデル名です。
  # thinking.type は enabled / disabled、reasoning_effort は provider にそのまま送る値です。不要なら null にします。
  profiles:
    cheap_api:
      provider: deepseek
      model: deepseek/deepseek-v4-flash
      timeout_seconds: 300
      max_retries: 2
      max_concurrency: 4
      rate_limit_per_minute: 60
      temperature: 0.0
      extra:
        thinking:
          type: disabled
          reasoning_effort: null
    reasoning_api:
      provider: deepseek
      # SGK-2026 (2026-08-15): モデルは Flash に統一（現状 Flash > Pro の判断）。
      # このプロファイルは重要判断ロール（planner / final_judgement / xss_final /
      # poc_judge）が使う。Flash は既定で深い推論を行う（reasoning_content を返す, 実測
      # ~5-8s）ため深く考えさせられる。速い経路（ハンター/マネージャ等）は cheap_api
      # （thinking 無効・実測 1-2s）を使う。旧 pro(thinking=high) は実測 5-14s でばらつき大。
      model: deepseek/deepseek-v4-flash
      timeout_seconds: 300
      max_retries: 2
      max_concurrency: 2
      rate_limit_per_minute: 30
      temperature: 0.0
      extra:
        # 注: flash は既定で深い推論を行い reasoning_content を返す（実測 ~8s）。
        # 一方 thinking.type=enabled を明示送信（extra_body.thinking）すると flash は
        # ハングする（実測 >80s、llm.py:229-254 経由）。reasoning_effort=high も同様。
        # よって重要判断ロールは thinking:null（＝param を送らず flash 既定の推論に任せる）。
        thinking: null
    vision_api:
      provider: openai
      model: openai/gpt-4o
      timeout_seconds: 300

  # SHIGOKU の機能ごとに使う profile を決めます。
  # 例: planner を別モデルにしたい場合は、planner.profile を追加した profile 名へ変更します。
  # fallback_profile は最初のモデルが失敗した時だけ使う予備の profile です。
  roles:
    planner:
      profile: reasoning_api
      fallback_profile: cheap_api
      system_prompt_template: conductor/planning.md
    swarm_manager:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: agents/manager_base.md
    tool_output_analysis:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/tool_output_analysis.md
    rag_compression:
      profile: cheap_api
      system_prompt_template: roles/rag_compression.md
    final_judgement:
      profile: reasoning_api
      fallback_profile: cheap_api
      system_prompt_template: roles/final_judgement.md
    specialist_light:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/specialist_light.md
    xss_specialist:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/xss_specialist.md
    xss_rejudge:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/xss_specialist.md
    xss_final:
      profile: reasoning_api
      fallback_profile: cheap_api
      system_prompt_template: roles/xss_specialist.md
    poc_judge:
      profile: reasoning_api
      fallback_profile: cheap_api
      system_prompt_template: roles/poc_judge.md
    sqli_specialist:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/sqli_specialist.md
    lfi_specialist:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/lfi_specialist.md
    cmd_ssrf_specialist:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/cmd_ssrf_specialist.md
    actor_critic:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/actor_critic.md
    recipe_generator:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/recipe_generator.md
    attack_suggester:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/attack_suggester.md
    response_classifier:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/response_classifier.md
    vuln_validator:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/vuln_validator.md
    chain_proposer:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/chain_proposer.md
    ops_intent:
      profile: cheap_api
      fallback_profile: reasoning_api
      system_prompt_template: roles/ops_intent.md
    vision_analysis:
      profile: vision_api
      fallback_profile: cheap_api
      system_prompt_template: roles/vision_analysis.md
      optional: true

ops_intent:
  feature_flag: true
  kill_switch: false
  llm_parse_timeout_sec: 15
  command_timeout_sec: 900
  retry_budget: 0
  max_attack_targets_per_run: 25
  non_tty_policy: fail_closed
  daily_llm_budget: 25

# 外部API設定
api:
  shodan_api_key: ${SHODAN_API_KEY}

# レポート設定
reporting:
  attack_paths:
    max_mermaid_nodes: 25
    max_mermaid_edges: 40
    max_top_paths: 5
